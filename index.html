<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- link do css com html -->
    <link rel="stylesheet" href="./css/style.css" />

    <!-- definição do favicon-->
    <link
      rel="icon"
      href="../jornada-viagens/img/Logo-provisória-branca 1.png"
    />

    <title>Jornada Viagens</title>
  </head>
  <body>
    <header>
      <!-- imagem com link da bússola -->
      <a class="logo" href="index.html" title="Voltar para página inicial">
        <img
          class="logo-mobile"
          src="../jornada-viagens/img/Logo-provisória-branca 1.png"
          alt="Bússola do Logo Jornada Viagens"
        />

        <img
          class="logo-desktop"
          src="../jornada-viagens/img/logo-branca-com-escrita.png"
          alt="Bússola do Logo Jornada Viagens"
        />
      </a>

      <!-- com a tag div podemos criar uma divisão genéria, para agrupar o menu hamburguer e os hyperlinks -->
      <div class="navigation-menu">
        <label for="menu">
          <!-- imagem do menu hamburguer -->
          <img
            src="../jornada-viagens/img/menu.png"
            alt="Menu para versão mobile"
          />
        </label>
        <input type="checkbox" id="menu" hidden />

        <!-- itens do menu navegação. Para isso, utilizamos a tag nav-->
        <nav>
          <ul class="list-link">
            <li>
              <a href="blog.html" target="_blank" title="Acessar Blog">Blog</a>
            </li>
            <li>
              <a
                href="pacotes.html"
                target="_blank"
                title="Acessar Pacotes de viagem"
                >Pacotes de viagem</a
              >
            </li>
            <li>
              <a href="contato.html" target="_blank" title="Acessar Contato"
                >Contato</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </header>
  </body>
</html>
