<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- link do css com html -->
    <link rel="stylesheet" href="./css/style.css" />

    <!-- definição do favicon-->
    <link
      rel="icon"
      href="../jornada-viagens/img/Logo-provisória-branca 1.png"
    />

    <title>Jornada Viagens</title>
  </head>
  <body>
    <header>
      <!-- imagem com link da bússola -->
      <a class="logo" href="index.html" title="Voltar para página inicial">
        <img
          class="logo-mobile"
          src="../jornada-viagens/img/Logo-provisória-branca 1.png"
          alt="Bússola do Logo Jornada Viagens"
        />

        <img
          class="logo-desktop"
          src="../jornada-viagens/img/logo-branca-com-escrita.png"
          alt="Bússola do Logo Jornada Viagens"
        />
      </a>

      <!-- com a tag div podemos criar uma divisão genéria, para agrupar o menu hamburguer e os hyperlinks -->
      <div class="navigation-menu">
        <label for="menu">
          <!-- imagem do menu hamburguer -->
          <img
            src="../jornada-viagens/img/menu.png"
            alt="Menu para versão mobile"
          />
        </label>
        <input type="checkbox" id="menu" hidden />

        <!-- itens do menu navegação. Para isso, utilizamos a tag nav-->
        <nav>
          <ul class="list-link">
            <li>
              <a href="blog.html" target="_blank" title="Acessar Blog">Blog</a>
            </li>
            <li>
              <a
                href="pacotes.html"
                target="_blank"
                title="Acessar Pacotes de viagem"
                >Pacotes de viagem</a
              >
            </li>
            <li>
              <a href="contato.html" target="_blank" title="Acessar Contato"
                >Contato</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- quando eu faço tag.class o vs code já cria a tag com a classe definida!
     neste momento, iremos criar a section.hero -->
    <section class="hero">
      <!--1º vem a imagem: -->
      <!--<img
        src="./img/hero-mobile.jpg"
        alt="imagem de uma paisagem na natureza"
      /> 
      utilizar o img direto daria um bug de resolução no celular (imagem ficaria maior) e na versão
      desktop o texto escaparia; como recomendação, utilzizaremos a imagem no "background"
      
      para tanto, criaremos uma nova <div> que receberá a imagem: -->
      <div class="hero-img"></div>
      <!--depois vem o texto-->
      <p>
        Somos uma agência apaixonada por criar viagens inesquecíveis. Do destino
        à seleção das atividades, cuidamos de todos os detalhes para que você
        aproveite ao máximo cada momento da sua jornada!
      </p>
    </section>

    <!-- seção das ofertas agora... -->
    <section class="offers">
      <div class="sectionTitle">
        <h2>Ofertas da Semana</h2>
        <hr />
      </div>
      <div class="offersCards">
        <article class="card">
          <header>
            <p>HOTEL+AÉREO</p>
          </header>
          <section>
            <h3>Japão</h3>
            <br />
            <span>R$ 4000</span>
          </section>
          <footer>
            <a href="#" class="button">Ver detalhes</a>
          </footer>
        </article>
      </div>
    </section>
  </body>
</html>
